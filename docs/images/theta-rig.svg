<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="dome" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#3b6ea8"/><stop offset="0.6" stop-color="#1c2f4d"/><stop offset="1" stop-color="#6b5a2a"/>
    </radialGradient>
    <radialGradient id="lens" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#4a6a96"/><stop offset="0.5" stop-color="#16202e"/><stop offset="1" stop-color="#0a0d12"/>
    </radialGradient>
    <marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4"><circle cx="4" cy="4" r="3" fill="#2f6fed"/></marker>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c7772b"/></marker>
  </defs>
  <rect width="1200" height="840" fill="#f6f7f9"/>
  <text x="40" y="52" font-size="28" font-weight="700" fill="#141824">Handheld rig: RICOH THETA Z1 + Livox Mid-360</text>
  <text x="40" y="82" font-size="16" fill="#566074">Front view, the side facing away from the person holding it. Both sit on one mini tripod, stacked on ball heads.</text>

  <!-- lidar field of view: band turned upright, wraps around the forward axis -->
  <circle cx="420" cy="356" r="150" fill="none" stroke="#c7772b" stroke-width="2" stroke-dasharray="7 7"/>
  <path d="M 545 273 A 150 150 0 0 1 568 326" fill="none" stroke="#c7772b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="420" font-size="15" fill="#9a5a1c" text-anchor="end">lidar band turned upright:</text>
  <text x="250" y="439" font-size="15" fill="#9a5a1c" text-anchor="end">a full ring up, down, left and right,</text>
  <text x="250" y="458" font-size="15" fill="#9a5a1c" text-anchor="end">leaning forward up to 52°</text>

  <!-- THETA Z1 on top -->
  <rect x="396" y="104" width="48" height="150" rx="16" fill="#2a2e36" stroke="#14171c" stroke-width="2"/>
  <circle cx="420" cy="134" r="19" fill="#14171c"/>
  <circle cx="420" cy="134" r="15" fill="url(#lens)"/>
  <circle cx="414" cy="128" r="3.5" fill="#cfe0f5" opacity="0.7"/>
  <rect x="406" y="168" width="28" height="44" rx="2" fill="#e9ebef"/>
  <g stroke="#8a92a3" stroke-width="1.5"><line x1="410" y1="196" x2="430" y2="196"/><line x1="410" y1="202" x2="426" y2="202"/></g>
  <rect x="410" y="172" width="14" height="14" fill="#3a4152"/>

  <!-- upper ball head -->
  <rect x="412" y="254" width="16" height="10" fill="#7a8292"/>
  <circle cx="420" cy="272" r="10" fill="#9aa1ae" stroke="#6b7384" stroke-width="1.5"/>
  <rect x="440" y="266" width="12" height="10" rx="3" fill="#6b7384"/><line x1="430" y1="271" x2="440" y2="271" stroke="#6b7384" stroke-width="3"/>
  <rect x="404" y="282" width="32" height="20" rx="4" fill="#59627a"/>

  <!-- lidar on its side in a cage, dome facing out (towards you here) -->
  <rect x="368" y="302" width="104" height="104" rx="12" fill="#9aa1ae" stroke="#6b7384" stroke-width="2"/>
  <g stroke="#6b7384" stroke-width="3"><line x1="378" y1="314" x2="462" y2="314"/><line x1="378" y1="324" x2="462" y2="324"/><line x1="378" y1="388" x2="462" y2="388"/><line x1="378" y1="396" x2="462" y2="396"/></g>
  <circle cx="420" cy="356" r="38" fill="url(#dome)" stroke="#16223a" stroke-width="2"/>
  <ellipse cx="408" cy="342" rx="12" ry="8" fill="#a9c6ea" opacity="0.35"/>
  <rect x="472" y="346" width="14" height="20" rx="3" fill="#59627a"/>

  <!-- lower ball head -->
  <rect x="404" y="406" width="32" height="14" rx="4" fill="#59627a"/>
  <circle cx="420" cy="432" r="12" fill="#9aa1ae" stroke="#6b7384" stroke-width="1.5"/>
  <rect x="444" y="426" width="12" height="12" rx="3" fill="#c7772b"/><line x1="432" y1="432" x2="444" y2="432" stroke="#6b7384" stroke-width="3"/>
  <rect x="404" y="442" width="32" height="14" rx="5" fill="#7a8292"/>

  <!-- mini tripod, legs closed: the handle -->
  <path d="M 396 456 L 444 456 L 456 712 Q 420 728 384 712 Z" fill="#3a4152" stroke="#20242e" stroke-width="2"/>
  <line x1="420" y1="464" x2="420" y2="716" stroke="#20242e" stroke-width="2"/>
  <line x1="404" y1="470" x2="394" y2="708" stroke="#20242e" stroke-width="1.5"/>
  <line x1="436" y1="470" x2="446" y2="708" stroke="#20242e" stroke-width="1.5"/>
  <rect x="426" y="520" width="10" height="26" rx="4" fill="#59627a"/>

  <!-- cables -->
  <path d="M 486 356 C 580 370, 610 520, 660 600 S 780 650, 842 628" fill="none" stroke="#20242e" stroke-width="5" stroke-linecap="round"/>
  <path d="M 444 230 C 700 110, 1160 150, 1080 460" fill="none" stroke="#4a5264" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="10 7"/>

  <!-- backpack with laptop and power bank -->
  <g transform="translate(0,80)">
    <rect x="820" y="380" width="300" height="300" rx="34" fill="#e3e6ec" stroke="#aab1bf" stroke-width="2"/>
    <path d="M 900 380 C 900 330, 1040 330, 1040 380" fill="none" stroke="#aab1bf" stroke-width="10"/>
    <text x="970" y="418" font-size="15" text-anchor="middle" fill="#566074">backpack</text>
    <rect x="852" y="440" width="150" height="100" rx="8" fill="#9aa1ae" stroke="#737b8c" stroke-width="2"/>
    <rect x="862" y="450" width="130" height="72" rx="3" fill="#20242e"/>
    <text x="927" y="492" font-size="14" text-anchor="middle" fill="#cfd6e4">MacBook</text>
    <rect x="836" y="540" width="182" height="10" rx="4" fill="#737b8c"/>
    <rect x="1026" y="474" width="66" height="34" rx="6" fill="#c7772b"/>
    <text x="1059" y="496" font-size="12" text-anchor="middle" fill="#fff">adapter</text>
    <rect x="852" y="580" width="140" height="62" rx="10" fill="#2a3040"/>
    <text x="922" y="608" font-size="14" text-anchor="middle" fill="#cfd6e4">power bank</text>
    <text x="922" y="628" font-size="12" text-anchor="middle" fill="#9aa4b8">12 V output</text>
    <path d="M 842 548 C 880 560, 990 560, 1040 508" fill="none" stroke="#20242e" stroke-width="4"/>
    <path d="M 842 548 C 830 590, 840 606, 852 610" fill="none" stroke="#a33" stroke-width="4"/>
    <path d="M 1026 492 L 1002 492" stroke="#20242e" stroke-width="4"/>
  </g>

  <!-- labels -->
  <g font-size="16" fill="#141824">
    <line x1="398" y1="134" x2="300" y2="120" stroke="#2f6fed" stroke-width="1.5" marker-start="url(#dot)"/>
    <text x="294" y="116" text-anchor="end" font-weight="700">RICOH THETA Z1, on top</text>
    <text x="294" y="136" text-anchor="end" font-size="14" fill="#566074">upright, lenses clear above the lidar</text>
    <text x="294" y="154" text-anchor="end" font-size="14" fill="#566074">one 6720 × 3360 photo of the whole sphere</text>

    <line x1="410" y1="272" x2="300" y2="236" stroke="#2f6fed" stroke-width="1.5" marker-start="url(#dot)"/>
    <text x="294" y="232" text-anchor="end" font-weight="700">Ball heads</text>
    <text x="294" y="252" text-anchor="end" font-size="14" fill="#566074">one under each device, locked tight</text>

    <line x1="452" y1="340" x2="596" y2="326" stroke="#2f6fed" stroke-width="1.5" marker-start="url(#dot)"/>
    <text x="602" y="322" font-weight="700">Livox Mid-360, in the middle, on its side</text>
    <text x="602" y="342" font-size="14" fill="#566074">in a cage, dome facing out, away from the holder</text>
    <text x="602" y="360" font-size="14" fill="#566074">sees floor and ceiling ahead as well as the walls;</text>
    <text x="602" y="378" font-size="14" fill="#566074">the THETA and tripod sit in its band at close range</text>

    <line x1="386" y1="600" x2="330" y2="620" stroke="#2f6fed" stroke-width="1.5" marker-start="url(#dot)"/>
    <text x="324" y="626" text-anchor="end" font-weight="700">Mini tripod, legs closed</text>
    <text x="324" y="646" text-anchor="end" font-size="14" fill="#566074">it is the handle; open the legs</text>
    <text x="324" y="664" text-anchor="end" font-size="14" fill="#566074">to stand it on a desk</text>

    <line x1="1036" y1="236" x2="972" y2="222" stroke="#2f6fed" stroke-width="1.5" marker-start="url(#dot)"/>
    <text x="966" y="212" text-anchor="end" font-weight="700">USB-C from the THETA</text>
    <text x="966" y="232" text-anchor="end" font-size="14" fill="#566074">optional: plug in to trigger</text>
    <text x="966" y="250" text-anchor="end" font-size="14" fill="#566074">and download from the Mac</text>

    <line x1="700" y1="618" x2="720" y2="716" stroke="#2f6fed" stroke-width="1.5" marker-start="url(#dot)"/>
    <text x="560" y="738" font-weight="700">One cable from the lidar</text>
    <text x="560" y="758" font-size="14" fill="#566074">splits into Ethernet (data, to the</text>
    <text x="560" y="776" font-size="14" fill="#566074">adapter) and power (red, 12 V)</text>
  </g>

  <text x="40" y="816" font-size="14" fill="#566074">No sync wiring: THETA photos are placed in the lidar scan afterwards by matching what they see. Sketch, not to scale.</text>
</svg>
